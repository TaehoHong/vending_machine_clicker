<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360"><rect width="1240" height="360" fill="#101b29"/><g font-family="Cafe24 PRO UP,카페24 프로업,sans-serif" fill="#ffffff"><text x="32" y="48" font-size="30">음료 구매 가격 · 매 구매 5% 상승 · 확정</text><text x="32" y="88" font-size="19" fill="#c4d4e0">첫 가격 100 Gold / n번째 가격 = 올림(100 × 1.05^(n-1))</text><g transform="translate(32 140)"><text y="-16" font-size="19" fill="#ffe475">1번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">100G</text><text y="119" font-size="17">정확한 가격 100</text></g><g transform="translate(232 140)"><text y="-16" font-size="19" fill="#ffe475">2번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">105G</text><text y="119" font-size="17">정확한 가격 105</text></g><g transform="translate(432 140)"><text y="-16" font-size="19" fill="#ffe475">3번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">111G</text><text y="119" font-size="17">정확한 가격 111</text></g><g transform="translate(632 140)"><text y="-16" font-size="19" fill="#ffe475">10번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">156G</text><text y="119" font-size="17">정확한 가격 156</text></g><g transform="translate(832 140)"><text y="-16" font-size="19" fill="#ffe475">50번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">1,093G</text><text y="119" font-size="17">정확한 가격 1,093</text></g><g transform="translate(1032 140)"><text y="-16" font-size="19" fill="#ffe475">100번째 구매</text><rect width="174" height="84" fill="#12121d"/><rect x="5" y="5" width="164" height="74" fill="#28536a"/><text x="87" y="51" text-anchor="middle" font-size="27" fill="#ffe475">12.5KG</text><text y="119" font-size="17">정확한 가격 12,524</text></g><text x="32" y="308" font-size="18" fill="#c4d4e0">성공한 구매만 증가 · 구매 횟수 저장/로드 · 새 게임 100G · 펀치 타격은 가격 유지</text></g></svg>